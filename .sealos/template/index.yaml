apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: csm-platform
spec:
  title: "客户成功工作台"
  url: ""
  gitRepo: ""
  author: "tinet"
  description: "天润融通客户成功管理平台 - 合同预警/余额预警/客户管理/跟进计划"
  readme: ""
  icon: ""
  templateType: inline
  categories:
    - productivity
  defaults:
    app_name:
      type: string
      value: csm-platform-{{ random(8) }}
    app_host:
      type: string
      value: csm-{{ random(8) }}
    nextauth_secret:
      type: string
      value: {{ random(32) }}
  inputs: null

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: csm-db-{{ random(8) }}
  annotations:
    sealos.io/db.cloud.sealos.io/name: postgresql
    sealos.io/db.cloud.sealos.io/version: "14.8.0"
spec:
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-14.8.0
  terminationPolicy: Delete
  componentSpecs:
    - name: postgresql
      componentDefRef: postgresql
      serviceAccountName: kb-postgresql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
      volumeClaimTemplates:
        - name: data
          spec:
            storageClassName:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ defaults.app_name }}
  annotations:
    origin: sealos
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: {{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: {{ defaults.app_name }}
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      containers:
        - name: {{ defaults.app_name }}
          image: ghcr.io/YOUR_GITHUB_USERNAME/csm-platform:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: csm-db-{{ random(8) }}-conn-credential
                  key: url
            - name: DB_SSL
              value: "true"
            - name: NEXTAUTH_SECRET
              value: {{ defaults.nextauth_secret }}
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: {{ defaults.app_name }}-secret
                  key: app-url
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: {{ defaults.app_name }}
spec:
  type: ClusterIP
  selector:
    app: {{ defaults.app_name }}
  ports:
    - port: 80
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ defaults.app_name }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/client-body-buffer-size: 16k
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    higress.io/backend-protocol: HTTP
spec:
  rules:
    - host: {{ defaults.app_host }}.{{ cloud.sealos.io }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: {{ defaults.app_name }}
                port:
                  number: 80
  tls:
    - hosts:
        - {{ defaults.app_host }}.{{ cloud.sealos.io }}
      secretName: wildcard-cert
